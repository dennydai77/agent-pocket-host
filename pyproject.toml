[project]
name = "agent-pocket-host"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12,<4",
    "cryptography>=46,<52",
    "pillow>=11,<13",
    "pypdf>=6,<7",
    "segno>=1.6,<2",
]
[project.scripts]
pocket-host = "pocket.cli:main"
pocket = "pocket.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-aiohttp>=1,<2", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.hatch.build.targets.wheel]
packages = ["pocket"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
